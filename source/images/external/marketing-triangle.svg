<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">营销活动的黄金三角形</title>
  <desc id="desc">成本、流量、转化率三个顶点。按作者观点，低成本、高流量、高转化率之间需要取舍，难以同时兼得。</desc>
  <rect width="800" height="540" rx="20" fill="#f7fafc"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="400" y="51" font-size="27" font-weight="700" fill="#17324d">营销活动的黄金三角形</text>
    <text x="400" y="80" font-size="16" fill="#65788a">作者的设计取舍观点</text>
    <path d="M400 160 L185 410 L615 410 Z" fill="#e5eef5" stroke="#6f8da6" stroke-width="3"/>
    <circle cx="400" cy="160" r="10" fill="#177e89"/>
    <circle cx="185" cy="410" r="10" fill="#177e89"/>
    <circle cx="615" cy="410" r="10" fill="#177e89"/>
    <text x="400" y="122" font-size="25" font-weight="700" fill="#17324d">成本</text>
    <text x="400" y="145" font-size="16" fill="#65788a">低成本</text>
    <text x="185" y="451" font-size="25" font-weight="700" fill="#17324d">流量</text>
    <text x="185" y="477" font-size="16" fill="#65788a">高流量</text>
    <text x="615" y="451" font-size="25" font-weight="700" fill="#17324d">转化率</text>
    <text x="615" y="477" font-size="16" fill="#65788a">高转化率</text>
    <text x="400" y="308" font-size="22" font-weight="700" fill="#17324d">三者难兼得</text>
    <text x="400" y="338" font-size="18" fill="#526b80">设计活动，需要取舍</text>
  </g>
</svg>
