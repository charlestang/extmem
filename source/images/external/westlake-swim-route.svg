<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">当年游泳路线示意</title>
  <desc id="desc">北朝上。苏堤从北往南第三座桥为压堤桥。下水位置概略画在压堤桥稍南处，虚线向东南的三潭映月、小瀛洲一带延伸。位置及路线不按比例，不是精确航迹。</desc>
  <defs>
    <marker id="route-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c35435"/></marker>
  </defs>
  <rect width="900" height="760" rx="20" fill="#fafcfb"/>
  <text x="450" y="49" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#19394b">当年游泳路线示意</text>
  <rect x="35" y="78" width="830" height="605" rx="16" fill="#e1f0f5"/>
  <path d="M35 78 H218 L246 128 L271 235 L298 356 L325 475 L350 585 L374 683 H35 Z" fill="#d5e7d6" opacity=".6"/>
  <g font-family="sans-serif" fill="#19394b">
    <text x="108" y="395" font-size="21" fill="#6b8d97">西里湖</text>
    <text x="706" y="246" font-size="28" fill="#799ba6">外西湖</text>
    <path d="M246 128 L374 652" fill="none" stroke="#79a679" stroke-width="21" stroke-linecap="round"/>
    <path d="M246 128 L374 652" fill="none" stroke="#cfe3b8" stroke-width="9" stroke-linecap="round"/>
    <text x="261" y="107" text-anchor="middle" font-size="18">苏堤北端（北山街）</text>
    <text x="235" y="558" font-size="24" fill="#53764f" transform="rotate(76 235 558)">苏堤</text>
    <g fill="#fbfcf9" stroke="#6d7f78" stroke-width="2">
      <path d="M237 163 L262 157 L265 170 L240 176 Z"/>
      <path d="M255 238 L280 232 L283 245 L258 251 Z"/>
      <path d="M274 314 L299 308 L302 321 L277 327 Z"/>
      <path d="M302 426 L327 420 L330 433 L305 439 Z"/>
      <path d="M326 524 L351 518 L354 531 L329 537 Z"/>
      <path d="M348 613 L373 607 L376 620 L351 626 Z"/>
    </g>
    <text x="124" y="173" font-size="18">① 跨虹桥</text>
    <text x="143" y="248" font-size="18">② 东浦桥</text>
    <text x="151" y="325" font-size="20" font-weight="700">③ 压堤桥</text>
    <text x="326" y="423" font-size="17" fill="#6a7f7b">望山桥</text>
    <text x="349" y="521" font-size="17" fill="#6a7f7b">锁澜桥</text>
    <text x="371" y="612" font-size="17" fill="#6a7f7b">映波桥</text>
    <text x="400" y="658" font-size="17">苏堤南端</text>
    <ellipse cx="571" cy="482" rx="67" ry="75" fill="#b8d5ab" stroke="#7da07a" stroke-width="2"/>
    <path d="M525 445 H560 V470 H525 Z M581 445 H612 V470 H581 Z M525 493 H560 V519 H525 Z M581 493 H612 V519 H581 Z" fill="#e1f0f5"/>
    <text x="668" y="472" font-size="22" font-weight="700">三潭映月</text>
    <text x="668" y="502" font-size="18">小瀛洲一带</text>
    <path d="M635 487 L655 487" stroke="#7da07a" stroke-width="2"/>
    <circle cx="299" cy="355" r="9" fill="#c35435" stroke="#fafcfb" stroke-width="3"/>
    <text x="355" y="321" font-size="19" font-weight="700" fill="#a4432b">下水处（示意）</text>
    <text x="355" y="348" font-size="16" fill="#746c60">从北数第三桥后，稍向南</text>
    <path d="M310 364 L490 490" fill="none" stroke="#c35435" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#route-arrow)"/>
    <text x="401" y="438" font-size="18" fill="#a4432b" transform="rotate(35 401 438)">游进方向</text>
    <ellipse cx="483" cy="493" rx="30" ry="24" fill="none" stroke="#c35435" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>
    <path d="M804 147 V112 M794 124 L804 109 L814 124" fill="none" stroke="#19394b" stroke-width="3" stroke-linecap="round"/>
    <text x="804" y="96" text-anchor="middle" font-size="21" font-weight="700">北</text>
    <text x="450" y="716" text-anchor="middle" font-size="17" fill="#6b7b83">位置与路径概略表达 · 不按比例</text>
  </g>
</svg>
